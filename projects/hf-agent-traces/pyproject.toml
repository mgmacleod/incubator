[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-agent-traces"
version = "0.1.0"
description = "Discover local agent transcripts and sync them with Hugging Face's Agent Trace Viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "incubator" }]
dependencies = [
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hf-agent-traces = "hf_agent_traces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
